# The one reverse proxy on the server, in front of every site. It's its own Compose project, so
# it keeps running while either app is rebuilt. Run it from this folder: `docker compose up -d`.
# The apps join the external `web` network, created once with `docker network create web`.
name: caddy

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy-data:
  caddy-config:
